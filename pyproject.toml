[project]
name = "beh3m0th"
version = "0.1.0"
description = "Beh3m0th — zero-cost-first autonomous multi-agent engineering platform"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "fastapi>=0.115",
    "aiosqlite>=0.20",
    "qdrant-client>=1.12",
    "fastembed>=0.4",
    "numpy>=2.0",
    "rank-bm25>=0.2.2",
    "networkx>=3.4",
    "igraph>=0.11",
    "leidenalg>=0.10",
    "langgraph>=0.2",
    "typer>=0.12",
    "rich>=13.9",
    "httpx>=0.27",
    "tiktoken>=0.8",
    "pyyaml>=6.0",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
ui = [
    "streamlit>=1.40",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beh3m0th"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
